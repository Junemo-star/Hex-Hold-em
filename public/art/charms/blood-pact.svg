<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#4f0d1b"/>
      <stop offset="100%" stop-color="#170207"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff335c" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#ffb8c6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#170207" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#ff335c" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#ffb8c6" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#ff335c" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#ff335c" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#ff335c" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#ff335c" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#ff335c" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XXXVIII</text>

  <!-- Sacred Geometry Layer -->
  
        <circle cx="128" cy="148" r="82" fill="none" stroke="#ff335c" stroke-width="2.2" opacity="0.5"/>
        <polygon points="128,68 198,188 58,188" fill="none" stroke="#ff335c" stroke-width="2" opacity="0.55"/>
        <polygon points="128,228 198,108 58,108" fill="none" stroke="#ffb8c6" stroke-width="2" opacity="0.55"/>
        <circle cx="128" cy="68" r="6" fill="#ff335c" opacity="0.8"/>
        <circle cx="128" cy="228" r="6" fill="#ffb8c6" opacity="0.8"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Blood-Stained Contract with Crimson Wax Seal -->
    <rect x="76" y="72" width="104" height="148" rx="6" fill="#2b192e" stroke="#ff4d79" stroke-width="3"/>
    <line x1="92" y1="98" x2="164" y2="98" stroke="#ff8fa3" stroke-width="4"/>
    <line x1="92" y1="118" x2="154" y2="118" stroke="#ff8fa3" stroke-width="4"/>
    <line x1="92" y1="138" x2="160" y2="138" stroke="#ff8fa3" stroke-width="4"/>
    <circle cx="144" cy="182" r="22" fill="#d90429" stroke="#ffccd5" stroke-width="3"/>
    <polygon points="144,168 150,180 162,180 152,188 156,200 144,192 132,200 136,188 126,180 138,180" fill="#ffccd5"/>
  </g>
</svg>
