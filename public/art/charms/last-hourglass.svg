<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#471236"/>
      <stop offset="100%" stop-color="#170411"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff66b5" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#ffd166" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#170411" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#ff66b5" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#ffd166" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#ff66b5" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#ff66b5" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#ff66b5" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#ff66b5" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#ff66b5" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XXXVII</text>

  <!-- Sacred Geometry Layer -->
  
        <circle cx="128" cy="148" r="86" fill="none" stroke="#ff66b5" stroke-width="2" opacity="0.45"/>
        <circle cx="128" cy="148" r="68" fill="none" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
        <polygon points="128,48 148,118 220,118 162,160 184,230 128,188 72,230 94,160 36,118 108,118" fill="#ff66b5" opacity="0.16"/>
        <polygon points="128,62 172,148 128,234 84,148" fill="none" stroke="#ff66b5" stroke-width="1.5" opacity="0.5"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Brass Hourglass with Glowing Magenta Sand -->
    <rect x="78" y="72" width="100" height="12" rx="5" fill="#ffd166" stroke="#fff3b0" stroke-width="2"/>
    <rect x="78" y="212" width="100" height="12" rx="5" fill="#ffd166" stroke="#fff3b0" stroke-width="2"/>
    <path d="M88,84 L168,84 L134,148 L168,212 L88,212 L122,148 Z" fill="#240046" fill-opacity="0.7" stroke="#ff9e00" stroke-width="3.5"/>
    <polygon points="104,116 152,116 128,146" fill="#ff007f"/>
    <polygon points="94,210 162,210 128,166" fill="#ff007f"/>
    <line x1="128" y1="146" x2="128" y2="176" stroke="#ff70a6" stroke-width="4" stroke-dasharray="4 3"/>
  </g>
</svg>
