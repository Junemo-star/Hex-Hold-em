<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#452b10"/>
      <stop offset="100%" stop-color="#170d04"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb44f" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#ffe680" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#170d04" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#ffb44f" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#ffe680" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#ffb44f" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#ffb44f" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#ffb44f" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#ffb44f" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#ffb44f" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">VI</text>

  <!-- Sacred Geometry Layer -->
  
        <rect x="58" y="78" width="140" height="140" fill="none" stroke="#ffb44f" stroke-width="1.8" opacity="0.45"/>
        <rect x="58" y="78" width="140" height="140" transform="rotate(45 128 148)" fill="#ffe680" opacity="0.13" stroke="#ffe680" stroke-width="1.8"/>
        <circle cx="128" cy="148" r="52" fill="none" stroke="#ffb44f" stroke-width="2" opacity="0.6"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Faceted Floating Amber Geomancy Crystal -->
    <polygon points="128,62 174,118 158,212 128,236 98,212 82,118" fill="#ff9f1c" stroke="#fff3b0" stroke-width="3"/>
    <polygon points="128,62 174,118 128,142 82,118" fill="#ffe169" opacity="0.85"/>
    <polygon points="128,142 174,118 158,212 128,236" fill="#d96b00" opacity="0.85"/>
    <polygon points="128,62 128,236 98,212 82,118" fill="#ffb703" opacity="0.55"/>
    <polygon points="58,155 72,138 78,172 62,182" fill="#ffd166" stroke="#fff3b0" stroke-width="1.5"/>
    <polygon points="196,142 182,128 178,162 192,170" fill="#ffd166" stroke="#fff3b0" stroke-width="1.5"/>
  </g>
</svg>
