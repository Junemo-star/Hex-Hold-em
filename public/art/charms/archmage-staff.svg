<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#331259"/>
      <stop offset="100%" stop-color="#100421"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#66f7ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#100421" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#ffe066" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#66f7ff" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#ffe066" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#ffe066" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#ffe066" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#ffe066" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#ffe066" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">L</text>

  <!-- Sacred Geometry Layer -->
  
        <circle cx="128" cy="148" r="82" fill="none" stroke="#ffe066" stroke-width="2.2" opacity="0.5"/>
        <polygon points="128,68 198,188 58,188" fill="none" stroke="#ffe066" stroke-width="2" opacity="0.55"/>
        <polygon points="128,228 198,108 58,108" fill="none" stroke="#66f7ff" stroke-width="2" opacity="0.55"/>
        <circle cx="128" cy="68" r="6" fill="#ffe066" opacity="0.8"/>
        <circle cx="128" cy="228" r="6" fill="#66f7ff" opacity="0.8"/>
      

  <!-- Center Medallion Pedestal -->
  <circle cx="128" cy="148" r="46" fill="#100421" fill-opacity="0.72" stroke="#ffe066" stroke-width="2.5"/>

  <!-- Main Artifact Icon -->
  <text x="128" y="172" text-anchor="middle" font-size="72" filter="url(#glow)">🪄</text>
</svg>
