<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#1f1c54"/>
      <stop offset="100%" stop-color="#0a0821"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#70e4ff" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#ff70c8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0821" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#70e4ff" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#ff70c8" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#70e4ff" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#70e4ff" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#70e4ff" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#70e4ff" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#70e4ff" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XXI</text>

  <!-- Sacred Geometry Layer -->
  
        <path d="M44,250 L44,125 Q44,52 128,44 Q212,52 212,125 L212,250 Z" fill="none" stroke="#70e4ff" stroke-width="2.5" opacity="0.5"/>
        <circle cx="128" cy="148" r="64" fill="none" stroke="#ff70c8" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.65"/>
        <rect x="83" y="103" width="90" height="90" transform="rotate(45 128 148)" fill="#70e4ff" opacity="0.14" stroke="#70e4ff" stroke-width="1.5"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Crystalline Prism Refracting Rainbow Beams -->
    <line x1="42" y1="158" x2="104" y2="142" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="132" x2="218" y2="104" stroke="#ff3366" stroke-width="6"/>
    <line x1="154" y1="142" x2="220" y2="130" stroke="#ffbe0b" stroke-width="6"/>
    <line x1="156" y1="152" x2="220" y2="156" stroke="#38b000" stroke-width="6"/>
    <line x1="154" y1="162" x2="218" y2="182" stroke="#3a86ff" stroke-width="6"/>
    <polygon points="128,74 184,196 72,196" fill="#90e0ef" fill-opacity="0.78" stroke="#ffffff" stroke-width="4"/>
    <polygon points="128,74 184,196 128,176" fill="#00b4d8" fill-opacity="0.55"/>
  </g>
</svg>
