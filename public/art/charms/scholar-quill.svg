<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#14304f"/>
      <stop offset="100%" stop-color="#06101c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78d2ff" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#ffd166" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06101c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#78d2ff" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#ffd166" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#78d2ff" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#78d2ff" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#78d2ff" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#78d2ff" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#78d2ff" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XXIII</text>

  <!-- Sacred Geometry Layer -->
  
        <circle cx="128" cy="148" r="88" fill="none" stroke="#78d2ff" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.65"/>
        <circle cx="128" cy="148" r="70" fill="#ffd166" opacity="0.15"/>
        <circle cx="128" cy="148" r="58" fill="none" stroke="#78d2ff" stroke-width="2.5" opacity="0.65"/>
        <path d="M88,82 A76,76 0 1,0 188,202 A62,62 0 1,1 88,82 Z" fill="#78d2ff" opacity="0.22"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Luminous Phoenix Feather Quill -->
    <path d="M82,218 L168,72" stroke="#fff3b0" stroke-width="5" stroke-linecap="round"/>
    <path d="M168,72 C196,92 184,148 134,174 C106,188 96,192 96,192 C96,192 96,144 124,108 C142,84 156,74 168,72 Z" fill="#00bbf9" stroke="#caf0f8" stroke-width="2.5"/>
    <path d="M168,72 C178,104 164,142 126,162 C114,132 138,94 168,72 Z" fill="#fee440" opacity="0.8"/>
    <circle cx="78" cy="224" r="6" fill="#fee440"/>
  </g>
</svg>
