<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#113d29"/>
      <stop offset="100%" stop-color="#06170f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57f7a4" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#b8ff70" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06170f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#57f7a4" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#b8ff70" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#57f7a4" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#57f7a4" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#57f7a4" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#57f7a4" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#57f7a4" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">V</text>

  <!-- Sacred Geometry Layer -->
  
        <circle cx="128" cy="148" r="88" fill="none" stroke="#57f7a4" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.65"/>
        <circle cx="128" cy="148" r="70" fill="#b8ff70" opacity="0.15"/>
        <circle cx="128" cy="148" r="58" fill="none" stroke="#57f7a4" stroke-width="2.5" opacity="0.65"/>
        <path d="M88,82 A76,76 0 1,0 188,202 A62,62 0 1,1 88,82 Z" fill="#57f7a4" opacity="0.22"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Glowing Druid Branch & Emerald Leaves -->
    <path d="M68,210 Q105,165 128,145 Q155,120 186,82" fill="none" stroke="#8c5828" stroke-width="14" stroke-linecap="round"/>
    <path d="M118,155 Q92,130 76,105" fill="none" stroke="#8c5828" stroke-width="9" stroke-linecap="round"/>
    <path d="M145,130 Q175,140 194,155" fill="none" stroke="#8c5828" stroke-width="8" stroke-linecap="round"/>
    <path d="M76,105 C55,85 75,62 96,85 C102,95 88,108 76,105 Z" fill="#57f7a4" stroke="#d4ffea" stroke-width="2"/>
    <path d="M186,82 C175,55 208,52 210,78 C210,94 192,92 186,82 Z" fill="#57f7a4" stroke="#d4ffea" stroke-width="2"/>
    <path d="M194,155 C218,142 224,172 200,178 C188,180 186,164 194,155 Z" fill="#38d989" stroke="#d4ffea" stroke-width="2"/>
    <path d="M132,115 C118,85 148,74 156,102 C158,114 140,120 132,115 Z" fill="#80ff72" stroke="#ffffff" stroke-width="2"/>
    <circle cx="95" cy="175" r="5" fill="#b8ff70"/>
    <circle cx="162" cy="105" r="4" fill="#b8ff70"/>
  </g>
</svg>
