<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#291547"/>
      <stop offset="100%" stop-color="#0d061a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#70e4ff" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#d599ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d061a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#70e4ff" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#d599ff" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#70e4ff" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#70e4ff" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#70e4ff" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#70e4ff" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#70e4ff" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">VII</text>

  <!-- Sacred Geometry Layer -->
  
        <circle cx="128" cy="148" r="86" fill="none" stroke="#70e4ff" stroke-width="2" opacity="0.45"/>
        <circle cx="128" cy="148" r="68" fill="none" stroke="#d599ff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
        <polygon points="128,48 148,118 220,118 162,160 184,230 128,188 72,230 94,160 36,118 108,118" fill="#70e4ff" opacity="0.16"/>
        <polygon points="128,62 172,148 128,234 84,148" fill="none" stroke="#70e4ff" stroke-width="1.5" opacity="0.5"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Occult Purple Wax Candle with Ghostly Cyan Flame -->
    <rect x="98" y="132" width="60" height="92" rx="8" fill="#5e2b97" stroke="#d599ff" stroke-width="3"/>
    <path d="M98,142 Q112,165 118,146 Q128,175 138,148 Q148,166 158,142" fill="#8b4bd1" stroke="#d599ff" stroke-width="2"/>
    <line x1="128" y1="132" x2="128" y2="118" stroke="#222" stroke-width="4"/>
    <path d="M128,60 C158,92 152,122 128,122 C104,122 98,92 128,60 Z" fill="#48cae4" stroke="#caf0f8" stroke-width="2.5"/>
    <path d="M128,78 C142,96 140,116 128,116 C116,116 114,96 128,78 Z" fill="#ffffff"/>
  </g>
</svg>
