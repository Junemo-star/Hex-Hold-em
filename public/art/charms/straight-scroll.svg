<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#3b2a14"/>
      <stop offset="100%" stop-color="#140d05"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcf70" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#70c4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#140d05" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#ffcf70" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#70c4ff" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#ffcf70" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#ffcf70" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#ffcf70" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#ffcf70" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#ffcf70" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XX</text>

  <!-- Sacred Geometry Layer -->
  
        <circle cx="128" cy="148" r="82" fill="none" stroke="#ffcf70" stroke-width="2.2" opacity="0.5"/>
        <polygon points="128,68 198,188 58,188" fill="none" stroke="#ffcf70" stroke-width="2" opacity="0.55"/>
        <polygon points="128,228 198,108 58,108" fill="none" stroke="#70c4ff" stroke-width="2" opacity="0.55"/>
        <circle cx="128" cy="68" r="6" fill="#ffcf70" opacity="0.8"/>
        <circle cx="128" cy="228" r="6" fill="#70c4ff" opacity="0.8"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Unrolled Ancient Parchment Scroll with Golden Runes -->
    <rect x="78" y="76" width="100" height="144" rx="6" fill="#f4e0b8" stroke="#c9933b" stroke-width="3"/>
    <rect x="66" y="68" width="124" height="18" rx="9" fill="#d98a2b" stroke="#fff1b8" stroke-width="2.5"/>
    <rect x="66" y="210" width="124" height="18" rx="9" fill="#d98a2b" stroke="#fff1b8" stroke-width="2.5"/>
    <line x1="94" y1="108" x2="162" y2="108" stroke="#7b2cbf" stroke-width="5" stroke-linecap="round"/>
    <line x1="94" y1="132" x2="152" y2="132" stroke="#3a86ff" stroke-width="5" stroke-linecap="round"/>
    <line x1="94" y1="156" x2="162" y2="156" stroke="#ff006e" stroke-width="5" stroke-linecap="round"/>
    <line x1="94" y1="180" x2="140" y2="180" stroke="#fb5607" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
