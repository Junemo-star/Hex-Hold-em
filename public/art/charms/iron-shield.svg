<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#1a2a3d"/>
      <stop offset="100%" stop-color="#080e17"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ac7ff" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#d6e8ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080e17" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#7ac7ff" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#d6e8ff" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#7ac7ff" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#7ac7ff" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#7ac7ff" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#7ac7ff" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#7ac7ff" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XXIV</text>

  <!-- Sacred Geometry Layer -->
  
        <rect x="58" y="78" width="140" height="140" fill="none" stroke="#7ac7ff" stroke-width="1.8" opacity="0.45"/>
        <rect x="58" y="78" width="140" height="140" transform="rotate(45 128 148)" fill="#d6e8ff" opacity="0.13" stroke="#d6e8ff" stroke-width="1.8"/>
        <circle cx="128" cy="148" r="52" fill="none" stroke="#7ac7ff" stroke-width="2" opacity="0.6"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Heavy Runic Knight Heater Shield -->
    <path d="M74,82 L182,82 L182,144 C182,192 128,224 128,224 C128,224 74,192 74,144 Z" fill="#33415c" stroke="#90e0ef" stroke-width="5"/>
    <path d="M88,96 L168,96 L168,142 C168,178 128,204 128,204 C128,204 88,178 88,142 Z" fill="#1b263b" stroke="#00b4d8" stroke-width="2"/>
    <line x1="128" y1="86" x2="128" y2="216" stroke="#90e0ef" stroke-width="4"/>
    <line x1="78" y1="142" x2="178" y2="142" stroke="#90e0ef" stroke-width="4"/>
    <circle cx="128" cy="142" r="14" fill="#00f5d4" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
