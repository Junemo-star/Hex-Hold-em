<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#0d2e5c"/>
      <stop offset="100%" stop-color="#041024"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4db8ff" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#041024" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#4db8ff" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#4db8ff" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#4db8ff" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#4db8ff" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#4db8ff" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#4db8ff" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XLVI</text>

  <!-- Sacred Geometry Layer -->
  
        <polygon points="128,50 210,148 128,246 46,148" fill="#4db8ff" opacity="0.14" stroke="#4db8ff" stroke-width="2"/>
        <polygon points="128,74 190,148 128,222 66,148" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.65"/>
        <line x1="36" y1="148" x2="220" y2="148" stroke="#4db8ff" stroke-width="1.2" opacity="0.4"/>
        <line x1="128" y1="44" x2="128" y2="252" stroke="#4db8ff" stroke-width="1.2" opacity="0.4"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Cobalt-Blue Arcane Blueprint Scroll with Hologram Sigil -->
    <rect x="68" y="76" width="120" height="144" rx="8" fill="#003566" stroke="#4cc9f0" stroke-width="3.5"/>
    <line x1="68" y1="106" x2="188" y2="106" stroke="#4cc9f0" stroke-width="1" opacity="0.45"/>
    <line x1="68" y1="136" x2="188" y2="136" stroke="#4cc9f0" stroke-width="1" opacity="0.45"/>
    <line x1="68" y1="166" x2="188" y2="166" stroke="#4cc9f0" stroke-width="1" opacity="0.45"/>
    <line x1="98" y1="76" x2="98" y2="220" stroke="#4cc9f0" stroke-width="1" opacity="0.45"/>
    <line x1="128" y1="76" x2="128" y2="220" stroke="#4cc9f0" stroke-width="1" opacity="0.45"/>
    <line x1="158" y1="76" x2="158" y2="220" stroke="#4cc9f0" stroke-width="1" opacity="0.45"/>
    <polygon points="128,96 168,148 128,200 88,148" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="128" cy="148" r="18" fill="none" stroke="#90e0ef" stroke-width="3"/>
    <polygon points="134,138 154,148 134,158" fill="#ffffff"/>
  </g>
</svg>
