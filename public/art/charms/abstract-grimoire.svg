<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#2c1654"/>
      <stop offset="100%" stop-color="#0e061f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c28cff" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#57f7a4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0e061f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#c28cff" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#57f7a4" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#c28cff" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#c28cff" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#c28cff" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#c28cff" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#c28cff" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XV</text>

  <!-- Sacred Geometry Layer -->
  
        <path d="M44,250 L44,125 Q44,52 128,44 Q212,52 212,125 L212,250 Z" fill="none" stroke="#c28cff" stroke-width="2.5" opacity="0.5"/>
        <circle cx="128" cy="148" r="64" fill="none" stroke="#57f7a4" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.65"/>
        <rect x="83" y="103" width="90" height="90" transform="rotate(45 128 148)" fill="#c28cff" opacity="0.14" stroke="#c28cff" stroke-width="1.5"/>
      

  <!-- Center Medallion Pedestal -->
  <circle cx="128" cy="148" r="46" fill="#0e061f" fill-opacity="0.72" stroke="#c28cff" stroke-width="2.5"/>

  <!-- Main Artifact Icon -->
  <text x="128" y="172" text-anchor="middle" font-size="72" filter="url(#glow)">📚</text>
</svg>
