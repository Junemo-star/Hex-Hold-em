<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#0f2d59"/>
      <stop offset="100%" stop-color="#050e21"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3ff" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#7cf7e4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050e21" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#4fc3ff" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#7cf7e4" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#4fc3ff" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#4fc3ff" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#4fc3ff" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#4fc3ff" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#4fc3ff" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">IV</text>

  <!-- Sacred Geometry Layer -->
  
        <polygon points="128,50 210,148 128,246 46,148" fill="#4fc3ff" opacity="0.14" stroke="#4fc3ff" stroke-width="2"/>
        <polygon points="128,74 190,148 128,222 66,148" fill="none" stroke="#7cf7e4" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.65"/>
        <line x1="36" y1="148" x2="220" y2="148" stroke="#4fc3ff" stroke-width="1.2" opacity="0.4"/>
        <line x1="128" y1="44" x2="128" y2="252" stroke="#4fc3ff" stroke-width="1.2" opacity="0.4"/>
      

  <!-- Center Medallion Pedestal -->
  <circle cx="128" cy="148" r="46" fill="#050e21" fill-opacity="0.72" stroke="#4fc3ff" stroke-width="2.5"/>

  <!-- Main Artifact Icon -->
  <text x="128" y="172" text-anchor="middle" font-size="72" filter="url(#glow)">💧</text>
</svg>
