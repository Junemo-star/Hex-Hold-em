<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#42123b"/>
      <stop offset="100%" stop-color="#140412"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6bd6" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#70e4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#140412" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#ff6bd6" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#70e4ff" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#ff6bd6" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#ff6bd6" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#ff6bd6" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#ff6bd6" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#ff6bd6" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XLVII</text>

  <!-- Sacred Geometry Layer -->
  
        <circle cx="128" cy="148" r="88" fill="none" stroke="#ff6bd6" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.65"/>
        <circle cx="128" cy="148" r="70" fill="#70e4ff" opacity="0.15"/>
        <circle cx="128" cy="148" r="58" fill="none" stroke="#ff6bd6" stroke-width="2.5" opacity="0.65"/>
        <path d="M88,82 A76,76 0 1,0 188,202 A62,62 0 1,1 88,82 Z" fill="#ff6bd6" opacity="0.22"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Psychic Crystal Brain-Skull Radiating Magenta Waves -->
    <circle cx="128" cy="142" r="64" fill="none" stroke="#ff70a6" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M86,136 C86,96 170,96 170,136 C170,158 156,168 152,182 L148,204 L108,204 L104,182 C100,168 86,158 86,136 Z" fill="#f72585" fill-opacity="0.85" stroke="#ffffff" stroke-width="3"/>
    <path d="M100,124 Q114,110 128,124 Q142,110 156,124" fill="none" stroke="#7209b7" stroke-width="4"/>
    <circle cx="112" cy="152" r="10" fill="#10002b"/>
    <circle cx="144" cy="152" r="10" fill="#10002b"/>
    <circle cx="112" cy="152" r="5" fill="#4cc9f0"/>
    <circle cx="144" cy="152" r="5" fill="#4cc9f0"/>
  </g>
</svg>
