<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#331c47"/>
      <stop offset="100%" stop-color="#11081c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa657" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#d499ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#11081c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#ffa657" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#d499ff" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#ffa657" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#ffa657" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#ffa657" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#ffa657" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#ffa657" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XI</text>

  <!-- Sacred Geometry Layer -->
  
        <circle cx="128" cy="148" r="88" fill="none" stroke="#ffa657" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.65"/>
        <circle cx="128" cy="148" r="70" fill="#d499ff" opacity="0.15"/>
        <circle cx="128" cy="148" r="58" fill="none" stroke="#ffa657" stroke-width="2.5" opacity="0.65"/>
        <path d="M88,82 A76,76 0 1,0 188,202 A62,62 0 1,1 88,82 Z" fill="#ffa657" opacity="0.22"/>
      

  <!-- Center Medallion Pedestal -->
  <circle cx="128" cy="148" r="46" fill="#11081c" fill-opacity="0.72" stroke="#ffa657" stroke-width="2.5"/>

  <!-- Main Artifact Icon -->
  <text x="128" y="172" text-anchor="middle" font-size="72" filter="url(#glow)">🧤</text>
</svg>
