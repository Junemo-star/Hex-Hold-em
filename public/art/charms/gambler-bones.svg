<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#1a3829"/>
      <stop offset="100%" stop-color="#07140d"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6bffb3" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#e8ffd9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07140d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#6bffb3" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#e8ffd9" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#6bffb3" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#6bffb3" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#6bffb3" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#6bffb3" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#6bffb3" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XXV</text>

  <!-- Sacred Geometry Layer -->
  
        <circle cx="128" cy="148" r="86" fill="none" stroke="#6bffb3" stroke-width="2" opacity="0.45"/>
        <circle cx="128" cy="148" r="68" fill="none" stroke="#e8ffd9" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
        <polygon points="128,48 148,118 220,118 162,160 184,230 128,188 72,230 94,160 36,118 108,118" fill="#6bffb3" opacity="0.16"/>
        <polygon points="128,62 172,148 128,234 84,148" fill="none" stroke="#6bffb3" stroke-width="1.5" opacity="0.5"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Bone-Carved Dice in Spectral Green Flame -->
    <rect x="68" y="96" width="66" height="66" rx="12" transform="rotate(-12 101 129)" fill="#f8f9fa" stroke="#57f7a4" stroke-width="3"/>
    <circle cx="88" cy="116" r="5" fill="#111"/>
    <circle cx="114" cy="142" r="5" fill="#111"/>
    <rect x="122" y="132" width="66" height="66" rx="12" transform="rotate(14 155 165)" fill="#e9ecef" stroke="#57f7a4" stroke-width="3"/>
    <circle cx="142" cy="150" r="5" fill="#d90429"/>
    <circle cx="155" cy="165" r="5" fill="#111"/>
    <circle cx="168" cy="180" r="5" fill="#d90429"/>
  </g>
</svg>
