<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#12402b"/>
      <stop offset="100%" stop-color="#05170e"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57f7a4" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#ffe066" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05170e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="300" fill="url(#bg)"/>
  <circle cx="128" cy="148" r="110" fill="url(#halo)"/>

  <!-- Tarot Outer & Inner Borders -->
  <rect x="10" y="10" width="236" height="280" rx="14" fill="none" stroke="#57f7a4" stroke-width="2.5" opacity="0.65"/>
  <rect x="17" y="17" width="222" height="266" rx="10" fill="none" stroke="#ffe066" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.45"/>

  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#57f7a4" opacity="0.8"/>
  <circle cx="228" cy="28" r="4" fill="#57f7a4" opacity="0.8"/>
  <circle cx="28" cy="242" r="4" fill="#57f7a4" opacity="0.8"/>
  <circle cx="228" cy="242" r="4" fill="#57f7a4" opacity="0.8"/>

  <!-- Roman Numeral Tarot Header -->
  <text x="128" y="39" text-anchor="middle" fill="#57f7a4" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" opacity="0.85">XII</text>

  <!-- Sacred Geometry Layer -->
  
        <rect x="58" y="78" width="140" height="140" fill="none" stroke="#57f7a4" stroke-width="1.8" opacity="0.45"/>
        <rect x="58" y="78" width="140" height="140" transform="rotate(45 128 148)" fill="#ffe066" opacity="0.13" stroke="#ffe066" stroke-width="1.8"/>
        <circle cx="128" cy="148" r="52" fill="none" stroke="#57f7a4" stroke-width="2" opacity="0.6"/>
      

  <!-- Custom Illustrated Artifact -->
  <g filter="url(#glow)">
    <!-- Glowing Golden Triquetra Talisman -->
    <circle cx="128" cy="148" r="52" fill="none" stroke="#ffd166" stroke-width="5"/>
    <path d="M128,76 C168,108 158,168 102,176 C92,132 112,92 128,76 Z" fill="none" stroke="#57f7a4" stroke-width="8"/>
    <path d="M182,178 C134,198 86,162 106,112 C148,122 174,154 182,178 Z" fill="none" stroke="#57f7a4" stroke-width="8"/>
    <path d="M74,178 C92,130 144,106 176,148 C146,182 102,188 74,178 Z" fill="none" stroke="#57f7a4" stroke-width="8"/>
    <circle cx="128" cy="148" r="12" fill="#ffe066" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
